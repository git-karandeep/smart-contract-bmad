[extend]
useDefault = true

[allowlist]
description = "Generated dependency, build, and compiler output"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.gradle/''',
  '''(^|/)build/''',
  '''(^|/)artifacts/''',
  '''(^|/)cache/''',
  '''(^|/)coverage/''',
  '''(^|/)out/''',
  '''^_bmad/_config/files-manifest\.csv$''',
  '''^docs/stories/.*\.md$''',
  '''^README\.md$''',
  '''^tests/e2e-smoke\.sh$'''
]
