version: '3.8'

services:
  # MongoDB with replica set
  mongodb:
    image: mongo:7.0
    container_name: smart-contracts-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: general-contracts
    volumes:
      - mongodb_data:/data/db
      - ./deployment/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-contracts-network

  # MongoDB replica set initialization
  mongodb-setup:
    image: mongo:7.0
    container_name: smart-contracts-mongodb-setup
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./deployment/init-replica-set.sh:/init-replica-set.sh:ro
    command: /init-replica-set.sh
    networks:
      - smart-contracts-network

  # Elasticsearch for Camunda
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: smart-contracts-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart-contracts-network

  # Camunda Zeebe
  zeebe:
    image: camunda/zeebe:8.9.0
    container_name: smart-contracts-zeebe
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_INDEX_PREFIX=zeebe-record
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    networks:
      - smart-contracts-network

  # Camunda Operate
  operate:
    image: camunda/operate:8.9.0
    container_name: smart-contracts-operate
    depends_on:
      - zeebe
      - elasticsearch
    ports:
      - "8081:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ELASTSEARCH_INDEX_PREFIX=zeebe-record
    networks:
      - smart-contracts-network

  # Camunda Tasklist
  tasklist:
    image: camunda/tasklist:8.9.0
    container_name: smart-contracts-tasklist
    depends_on:
      - zeebe
      - elasticsearch
    ports:
      - "8082:8080"
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ELASTSEARCH_URL=http://elasticsearch:9200
    networks:
      - smart-contracts-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smart-contracts-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - smart-contracts-network

  # Zookeeper required by Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: smart-contracts-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - smart-contracts-network

  # Anvil (local Ethereum node for development)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: smart-contracts-anvil
    ports:
      - "8545:8545"
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --block-time 12
    networks:
      - smart-contracts-network

volumes:
  mongodb_data:
  elasticsearch_data:
  zeebe_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:

networks:
  smart-contracts-network:
    driver: bridge
