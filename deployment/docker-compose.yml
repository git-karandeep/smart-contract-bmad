name: smart-contracts

services:
  mongodb:
    image: mongo:7.0.17
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/admin", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [smart-contracts]

  mongodb-setup:
    image: mongo:7.0.17
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["/bin/bash", "/init-replica-set.sh"]
    restart: "no"
    networks: [smart-contracts]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "cub zk-ready zookeeper:2181 10"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [smart-contracts]

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "cub kafka-ready -b localhost:29092 1 20"]
      interval: 10s
      timeout: 25s
      retries: 10
    networks: [smart-contracts]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8084}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [smart-contracts]

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.3.1
    ports:
      - "127.0.0.1:${ANVIL_HOST_PORT:-8545}:8545"
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--accounts", "10", "--balance", "10000", "--block-time", "12"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [smart-contracts]

  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      MONGODB_URI: mongodb://mongodb:27017/general-contracts?replicaSet=rs0
      MONGODB_DATABASE: general-contracts
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_MESSAGING_ENABLED: "true"
      CHAIN_RPC_URL: http://anvil:8545
      CHAIN_ID: 31337
      SIGNER_MODE: local-dev-only
      APP_SECURITY_USERNAME: ${APP_SECURITY_USERNAME:-local-dev}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-local-dev-only}
      CAMUNDA_GRPC_ADDRESS: http://zeebe:26500
      CAMUNDA_REST_ADDRESS: http://zeebe:8080
    depends_on:
      mongodb-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      anvil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [smart-contracts]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: [workflow]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [smart-contracts]

  zeebe:
    image: camunda/zeebe:8.9.0
    profiles: [workflow]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:26500:26500"
      - "127.0.0.1:9600:9600"
    environment:
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_INDEX_PREFIX: zeebe-record
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: 1
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    networks: [smart-contracts]

  operate:
    image: camunda/operate:8.9.0
    profiles: [workflow]
    depends_on: [zeebe, elasticsearch]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ELASTSEARCH_INDEX_PREFIX: zeebe-record
    networks: [smart-contracts]

  tasklist:
    image: camunda/tasklist:8.9.0
    profiles: [workflow]
    depends_on: [zeebe, elasticsearch]
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_TASKLIST_ELASTSEARCH_URL: http://elasticsearch:9200
    networks: [smart-contracts]

volumes:
  mongodb_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  elasticsearch_data:
  zeebe_data:

networks:
  smart-contracts:
    driver: bridge
