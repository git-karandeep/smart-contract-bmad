spring:
  application:
    name: smart-contracts-startup
  lifecycle:
    timeout-per-shutdown-phase: 20s
  aop:
    proxy-target-class: true
  security:
    ssl:
      enabled: ${SPRING_SECURITY_SSL_ENABLED:false}
      keystore:
        location: ${SPRING_SECURITY_SSL_KEYSTORE_LOCATION:}
        type: ${SPRING_SECURITY_SSL_KEYSTORE_TYPE:PKCS12}
        provider: ${SPRING_SECURITY_SSL_KEYSTORE_PROVIDER:}
        password: ${SPRING_SECURITY_SSL_KEYSTORE_PASSWORD:}
        key-password: ${SPRING_SECURITY_SSL_KEY_PASSWORD:}
        key-alias: ${SPRING_SECURITY_SSL_KEY_ALIAS:}
      truststore:
        location: ${SPRING_SECURITY_SSL_TRUSTSTORE_LOCATION:}
        type: ${SPRING_SECURITY_SSL_TRUSTSTORE_TYPE:PKCS12}
        provider: ${SPRING_SECURITY_SSL_TRUSTSTORE_PROVIDER:}
        password: ${SPRING_SECURITY_SSL_TRUSTSTORE_PASSWORD:}
    api:
      base-url: ${API_BASE_URL:}
      check-server-cert: ${API_CHECK_SERVER_CERT:true}
      headers:
        Authorization: ${API_AUTHORIZATION:}
  data:
    mongodb:
      database: ${MONGODB_DATABASE:general-contracts}
      auto-index-creation: true
      uuid-representation: standard
      authentication-database: ${MONGODB_AUTH_DATABASE:admin}
      ssl:
        enabled: ${MONGODB_SSL_ENABLED:false}
        invalid-hostname-allowed: ${MONGODB_SSL_INVALID_HOSTNAME_ALLOWED:false}
        certificate: ${MONGODB_SSL_CERTIFICATE:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: ${APP_MESSAGING_ENABLED:false}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: settlement-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: ai.generalcontracts.startup.messaging.PlatformEvent
        spring.json.trusted.packages: ai.generalcontracts.startup.messaging
  mongodb:
    database: ${MONGODB_DATABASE:general-contracts}
    auto-index-creation: true
    uuid-representation: standard
    authentication-database: ${MONGODB_AUTH_DATABASE:admin}
    ssl:
      enabled: ${MONGODB_SSL_ENABLED:false}
      invalid-hostname-allowed: ${MONGODB_SSL_INVALID_HOSTNAME_ALLOWED:false}
      certificate: ${MONGODB_SSL_CERTIFICATE:}

server:
  port: ${SERVER_PORT:8443}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

chain:
  rpc-url: ${CHAIN_RPC_URL:http://localhost:8545}
  rpc-timeout-seconds: ${CHAIN_RPC_TIMEOUT_SECONDS:5}
  chain-id: ${CHAIN_ID:31337}
  confirmations: ${CHAIN_CONFIRMATIONS:6}
  contracts:
    escrow: ${ESCROW_ADDRESS:}
    asset-token: ${ASSET_TOKEN_ADDRESS:}
  signer:
    mode: ${SIGNER_MODE:vault}
    key-ref: ${SIGNER_KEY_REF:}

app:
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:false}

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - java.lang.Exception
        ignore-exceptions:
          - java.lang.IllegalArgumentException
      transactionalRetry:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - java.lang.Exception
          - org.springframework.dao.DataAccessException
          - org.springframework.transaction.TransactionException
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10
        sliding-window-type: count-based
      transactionalCircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10
        sliding-window-type: count-based
