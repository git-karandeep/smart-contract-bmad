spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:general-contracts}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DATABASE:admin}
      ssl:
        enabled: ${MONGODB_SSL_ENABLED:true}
        invalid-hostname-allowed: ${MONGODB_SSL_INVALID_HOSTNAME_ALLOWED:false}
        certificate: ${MONGODB_SSL_CERTIFICATE:}
  mongodb:
    uri: ${MONGODB_URI:}
    database: ${MONGODB_DATABASE:general-contracts}
    username: ${MONGODB_USERNAME:}
    password: ${MONGODB_PASSWORD:}
    authentication-database: ${MONGODB_AUTH_DATABASE:admin}
    ssl:
      enabled: ${MONGODB_SSL_ENABLED:true}
      invalid-hostname-allowed: ${MONGODB_SSL_INVALID_HOSTNAME_ALLOWED:false}
      certificate: ${MONGODB_SSL_CERTIFICATE:}

chain:
  rpc-url: ${CHAIN_RPC_URL:}
  chain-id: ${CHAIN_ID:1}
  confirmations: ${CHAIN_CONFIRMATIONS:6}
  contracts:
    escrow: ${ESCROW_ADDRESS:}
    asset-token: ${ASSET_TOKEN_ADDRESS:}
  signer:
    mode: ${SIGNER_MODE:vault}
    key-ref: ${SIGNER_KEY_REF:}

app:
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:}
      audience: ${APP_SECURITY_JWT_AUDIENCE:}

server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: file:${SERVER_SSL_KEY_STORE_PATH:/run/secrets/server-keystore.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
    trust-store: file:${SERVER_SSL_TRUST_STORE_PATH:/run/secrets/client-truststore.p12}
    trust-store-password: ${SERVER_SSL_TRUST_STORE_PASSWORD:}
    trust-store-type: PKCS12
    client-auth: ${SERVER_SSL_CLIENT_AUTH:want}
